# docker-compose.dev.yml — Конфигурация для локальной разработки
# ПРОБЛЕМА 23 FIX: отдельный compose-файл для разработки с монтированием исходников.
#
# Использование:
#   docker-compose -f docker-compose.dev.yml up --build
#
# Особенности:
#   - Исходники монтируются в контейнер (изменения применяются без пересборки)
#   - Данные БД хранятся в ./data (видны снаружи контейнера)
#   - watchdog перезапускает бота при изменении .py файлов
#   - Порт health-check 8080 доступен с хоста для отладки
#
# Установка watchdog для hot-reload:
#   pip install watchdog[watchmedo]

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manicure_bot_dev
    restart: "no"
    env_file:
      - .env
    volumes:
      # Монтируем исходники для hot-reload без пересборки образа
      - .:/app
      # Данные БД — отдельный volume для сохранности
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/manicure_bot.db
      - HEALTH_PORT=8080
      - LOG_LEVEL=DEBUG
    ports:
      # Health-check доступен с хоста для отладки
      - "8080:8080"
    # Hot-reload через watchdog (перезапуск при изменении *.py файлов)
    # Если watchdog не установлен — используйте: command: python main.py
    command: >
      sh -c "pip install --quiet watchdog 2>/dev/null || true &&
             watchmedo auto-restart
               --patterns='*.py'
               --recursive
               --signal SIGTERM
               -- python main.py"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Раскомментируйте для разработки с Redis FSM Storage:
  # redis:
  #   image: redis:7-alpine
