[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "manicure-bot"
version = "4.1.0"
description = "Telegram-бот для онлайн-записи на маникюр"
requires-python = ">=3.10"
# Синхронизировано с requirements.txt
dependencies = [
    "aiogram==3.13.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "apscheduler[sqlalchemy]==3.10.4",
    "python-dotenv==1.0.1",
    "SQLAlchemy==2.0.36",
    "aiohttp==3.10.11",
    "tzdata==2024.2",
]

[project.optional-dependencies]
redis = ["redis==5.2.0", "aiogram[redis]==3.13.1"]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "mypy==1.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
exclude = ["tests/", "venv/", ".venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
    "-q",
]
markers = [
    "unit: unit tests (no DB or external services)",
    "integration: integration tests (require DB)",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Покрытие 20%+ реалистично для Telegram-бота: handlers требуют интеграционных тестов с моком бота.
# Повышайте этот порог по мере добавления интеграционных тестов.
fail_under = 20

[tool.coverage.run]
omit = [
    "tests/*",
    "*/migrations/*",
    # Handlers требуют aiogram-mock — исключены из coverage порога
    "src/presentation/handlers/*",
]
