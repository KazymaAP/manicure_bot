[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "manicure-bot"
version = "4.0.0"
description = "Telegram-бот для онлайн-записи на маникюр"
requires-python = ">=3.10"
dependencies = [
    "aiogram==3.13.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "apscheduler==3.10.4",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
redis = ["redis==5.2.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
