[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "manicure-bot"
version = "4.0.0"
description = "Telegram-бот для онлайн-записи на маникюр"
requires-python = ">=3.10"
# FIXED BUG-12: синхронизированы зависимости с requirements.txt.
# Ранее отсутствовали aiohttp, tzdata, SQLAlchemy — критически важные пакеты.
# mypy, pytest перенесены в [project.optional-dependencies] как dev-зависимости.
dependencies = [
    "aiogram==3.13.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "apscheduler[sqlalchemy]==3.10.4",
    "python-dotenv==1.0.1",
    # FIXED BUG-C1: синхронизированы версии с requirements.txt
    # Ранее: SQLAlchemy==2.0.20, aiohttp==3.9.1 (уязвимость CVE-2024-23829), tzdata==2024.1
    "SQLAlchemy==2.0.36",
    "aiohttp==3.10.11",
    "tzdata==2024.2",
]

[project.optional-dependencies]
redis = ["redis==5.2.0"]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.23.2",
    "mypy==1.7.1",
    "types-aiohttp==3.9.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
exclude = ["tests/", "venv/", ".venv/"]

