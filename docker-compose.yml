
# FIXED H-5: добавлена версия, явная сеть и секция для Redis с healthcheck
version: "3.9"

services:
  bot:
    build: .
    container_name: manicure_bot_v4
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot_data:/app/data
    environment:
      - DB_PATH=/app/data/manicure_bot.db
      - HEALTH_PORT=8080
    # FIXED H-8: не пробрасываем 8080 наружу — health server слушает только 127.0.0.1
    # Если нужен внешний мониторинг — используйте внутреннюю Docker-сеть или nginx-прокси
    # ports:
    #   - "127.0.0.1:8080:8080"
    networks:
      - bot_network
    # FIXED HIGH-08: curl не установлен в python:3.12-slim.
    # Используем python -c для healthcheck — он всегда доступен в нашем образе.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Раскомментируйте если используете Redis FSM Storage
  # redis:
  #   image: redis:7-alpine
  #   container_name: manicure_bot_redis
  #   restart: unless-stopped
  #   # FIXED H-5: healthcheck для Redis
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #   networks:
  #     - bot_network
  #   volumes:
  #     - redis_data:/data

networks:
  # FIXED H-5: явная сеть для изоляции сервисов
  bot_network:
    driver: bridge

volumes:
  bot_data:
  # redis_data:
