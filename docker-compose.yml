
services:
  bot:
    build: .
    container_name: manicure_bot_v4
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot_data:/app/data
    environment:
      - DB_PATH=/app/data/manicure_bot.db
      - HEALTH_PORT=8080
    ports:
      - "8080:8080"
    # FIXED: добавлены healthcheck и restart policy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Раскомментируйте если используете Redis FSM Storage
  # redis:
  #   image: redis:7-alpine
  #   container_name: manicure_bot_redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data

volumes:
  bot_data:
  # redis_data:
