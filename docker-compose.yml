services:
  bot:
    build: .
    container_name: manicure_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot_data:/app/data
    environment:
      - DB_PATH=/app/data/manicure_bot.db
      - HEALTH_PORT=8080
    # Health server биндится только на 127.0.0.1 внутри контейнера (H-8).
    # Для внешнего мониторинга раскомментируйте строку ниже и используйте nginx-прокси:
    # ports:
    #   - "127.0.0.1:8080:8080"
    networks:
      - bot_network
    # Healthcheck через встроенный Python (curl может отсутствовать в slim-образе)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Раскомментируйте если используете Redis FSM Storage (рекомендуется для production):
  # redis:
  #   image: redis:7-alpine
  #   container_name: manicure_bot_redis
  #   restart: unless-stopped
  #   command: redis-server --save 60 1 --loglevel warning
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #   networks:
  #     - bot_network
  #   volumes:
  #     - redis_data:/data

networks:
  # Изолированная сеть для сервисов бота
  bot_network:
    driver: bridge

volumes:
  bot_data:
    # redis_data:
